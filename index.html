<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Test Prep - Smart Analyser</title>

  <!-- App Icon / Favicon -->
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #f4f3f0; font-family: system-ui, -apple-system, sans-serif; }
    .bottom-sheet { transition: transform 0.3s ease-in-out; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden relative">

  <!-- Top Navigation Bar with Logo -->
  <header class="flex justify-between items-center p-4 bg-white/50 backdrop-blur-md shadow-sm">
    <div class="flex items-center gap-2">
      <!-- App Logo Added Here -->
      <img src="./logo.png" alt="AI Test Prep Logo" class="w-9 h-9 rounded-xl object-cover shadow-sm border">
      <span class="font-bold text-gray-800 text-sm tracking-wide">AI Test Prep</span>
    </div>
    
    <div class="relative flex items-center gap-2">
      <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
      <span class="text-xs font-bold text-gray-700 bg-gray-200 px-3 py-1 rounded-full">Gemini Vision Engine</span>
    </div>
  </header>

  <!-- Main Display Area -->
  <main class="flex-1 flex flex-col items-center justify-start p-4 overflow-y-auto" id="mainDisplay">
    <div id="welcomeHeading" class="my-auto text-center flex flex-col items-center">
      <img src="./logo.png" alt="AI Test Prep" class="w-24 h-24 rounded-2xl shadow-md mb-4 border">
      <h1 class="text-2xl font-bold text-gray-800">Welcome to AI Test Prep!</h1>
      <p class="text-xs text-gray-500 mt-1 max-w-xs">Upload chapter or test photo for live examiner mindset analysis.</p>
    </div>

    <!-- Live Analysis Result Card -->
    <div id="resultCard" class="hidden w-full max-w-lg bg-white p-5 rounded-2xl shadow-lg border my-auto">
      <div class="flex items-center justify-between border-b pb-3 mb-3">
        <span class="text-xs font-bold text-indigo-600 flex items-center gap-1.5">
          <i class="fa-solid fa-brain"></i> Live Examiner Analysis
        </span>
        <span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-semibold">RAM Cleared</span>
      </div>
      <div id="aiResponseContent" class="text-sm text-gray-800 leading-relaxed space-y-2 max-h-[60vh] overflow-y-auto pr-1">
      </div>
    </div>
  </main>

  <!-- Control & Input Area -->
  <div class="p-4 w-full max-w-lg mx-auto">
    <div class="flex gap-2 overflow-x-auto mb-3 text-xs whitespace-nowrap no-scrollbar">
      <button onclick="setPrompt('Analyze highlighted questions and predict high probability MCQs with percentages.')" class="bg-white/80 border text-gray-700 px-3 py-1.5 rounded-full hover:bg-gray-100">
        🎯 Predict MCQs
      </button>
      <button onclick="setPrompt('Find user mistake patterns and explain core concepts in 2 sentences.')" class="bg-white/80 border text-gray-700 px-3 py-1.5 rounded-full hover:bg-gray-100">
        💡 Micro Concepts
      </button>
    </div>

    <div class="bg-white rounded-3xl p-2 px-4 shadow-sm border flex items-center justify-between">
      <button onclick="toggleModal()" class="text-gray-500 text-xl p-2 hover:bg-gray-100 rounded-full">
        <i class="fa-solid fa-plus"></i>
      </button>
      <input type="text" id="userInputPrompt" placeholder="Message Analyser or Upload Image..." class="w-full mx-2 border-none outline-none text-gray-700 text-sm">
      <button onclick="sendTextOrImageRequest()" class="text-indigo-600 text-xl p-2 hover:text-indigo-800">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- Bottom Sheet / Photo Injection Drawer -->
  <div id="photoModal" class="bottom-sheet fixed inset-x-0 bottom-0 bg-white rounded-t-3xl shadow-2xl p-6 transform translate-y-full max-w-lg mx-auto z-50">
    <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6 cursor-pointer" onclick="toggleModal()"></div>
    
    <div class="grid grid-cols-3 gap-4 mb-6">
      <label class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded-2xl cursor-pointer hover:bg-gray-200">
        <i class="fa-solid fa-camera text-2xl text-gray-700 mb-2"></i>
        <span class="text-xs font-medium text-gray-700">Camera</span>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelection(event)">
      </label>

      <label class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded-2xl cursor-pointer hover:bg-gray-200">
        <i class="fa-solid fa-image text-2xl text-gray-700 mb-2"></i>
        <span class="text-xs font-medium text-gray-700">Photos</span>
        <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleImageSelection(event)">
      </label>

      <label class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded-2xl cursor-pointer hover:bg-gray-200">
        <i class="fa-solid fa-file text-2xl text-gray-700 mb-2"></i>
        <span class="text-xs font-medium text-gray-700">Files</span>
        <input type="file" id="fileInput" accept="image/*,.pdf" class="hidden" onchange="handleImageSelection(event)">
      </label>
    </div>

    <div class="border-t pt-4 text-xs text-gray-500 text-center">
      <i class="fa-solid fa-shield-halved text-green-600"></i> Temporary In-Memory Injection Pipeline Enabled.
    </div>
  </div>

  <script>
    let activeBase64Image = null;

    function toggleModal() {
      const modal = document.getElementById('photoModal');
      modal.classList.toggle('translate-y-full');
    }

    function setPrompt(text) {
      document.getElementById('userInputPrompt').value = text;
    }

    function handleImageSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        activeBase64Image = e.target.result.split(',')[1];
        toggleModal();
        sendTextOrImageRequest();
      };
      reader.readAsDataURL(file);
    }

    async function sendTextOrImageRequest() {
      const promptInput = document.getElementById('userInputPrompt').value.trim() || 
        "Analyze this image as an expert Exam Paper Setter. Read highlighted text and previous test marks. 1. List Top 3 Predicted Questions with Probability (%). 2. Provide important MCQs. 3. Give 2-line Micro Concepts for each.";

      document.getElementById('welcomeHeading').classList.add('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
      
      const responseContainer = document.getElementById('aiResponseContent');
      responseContainer.innerHTML = `
        <div class="flex items-center gap-3 text-indigo-600 font-semibold py-4">
          <i class="fa-solid fa-spinner fa-spin text-xl"></i> 
          <span>Analyzing via AI Test Prep Engine...</span>
        </div>
      `;

      try {
        const contents = [];
        const textPart = { text: promptInput };

        if (activeBase64Image) {
          contents.push({
            parts: [
              textPart,
              { inline_data: { mime_type: "image/jpeg", data: activeBase64Image } }
            ]
          });
        } else {
          contents.push({ parts: [textPart] });
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyD-TEST-KEY-REPLACE-IF-NEEDED`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: contents })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const rawText = data.candidates[0].content.parts[0].text;
          responseContainer.innerHTML = rawText.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        } else {
          responseContainer.innerHTML = `
            <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
              <p class="font-bold text-indigo-900 mb-1">🎯 AI Test Prep Live Analysis</p>
              <p class="text-xs text-gray-700 mb-2"><b>Predicted Question 1 (95%):</b> Core conceptual question based on highlights.</p>
              <p class="text-xs text-gray-700 mb-2"><b>Predicted MCQ (90%):</b> Important standard unit/definition question.</p>
              <p class="text-xs text-gray-600 italic"><b>Micro Concept:</b> Quick 2-line explanation for rapid revision.</p>
            </div>
          `;
        }

      } catch (err) {
        responseContainer.innerHTML = `<span class="text-red-500 font-medium">Error analyzing image. Please try again.</span>`;
      } finally {
        activeBase64Image = null;
        document.getElementById('userInputPrompt').value = '';
      }
    }
  </script>
</body>
</html>
