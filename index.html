<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Exam & Mindset Analyser AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #f4f3f0; font-family: sans-serif; }
    .bottom-sheet { transition: transform 0.3s ease-in-out; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden relative">

  <!-- Top Navigation Bar -->
  <header class="flex justify-between items-center p-4">
    <button class="text-xl p-2 rounded-full hover:bg-gray-200"><i class="fa-solid fa-bars"></i></button>
    <div class="relative">
      <button id="modelSelectorBtn" class="bg-gray-200 text-sm font-medium px-4 py-1.5 rounded-full flex items-center gap-1">
        Auto AI Router <i class="fa-solid fa-chevron-down text-xs"></i>
      </button>
    </div>
    <button class="text-xl p-2 rounded-full hover:bg-gray-200"><i class="fa-solid fa-xmark"></i></button>
  </header>

  <!-- Main Hero Greeting & Output Area -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 overflow-y-auto" id="mainDisplay">
    <h1 class="text-2xl font-semibold text-gray-800 text-center">Glad you're here, hira!</h1>
    <p class="text-sm text-gray-500 mt-2 text-center">Inject an image of your notes or test paper to predict examiner questions.</p>
    
    <!-- AI Output Card (Hidden by default) -->
    <div id="outputCard" class="hidden w-full max-w-lg bg-white p-5 rounded-2xl shadow-md border mt-4">
      <div class="flex items-center justify-between border-b pb-2 mb-3">
        <span class="text-xs font-bold text-green-600 uppercase tracking-wide" id="activeModelTag">Gemini / GPT Auto Engine</span>
        <span class="text-xs text-gray-400">Temporary Storage: Wiped</span>
      </div>
      <div id="analysisResults" class="text-sm text-gray-700 space-y-3">
        <!-- AI Prediction results will render here -->
      </div>
    </div>
  </main>

  <!-- Input Bar Area -->
  <div class="p-4 w-full max-w-lg mx-auto">
    <!-- Quick Action Chips -->
    <div class="flex gap-2 overflow-x-auto mb-3 text-xs whitespace-nowrap no-scrollbar">
      <button class="bg-white/80 border text-gray-700 px-3 py-1.5 rounded-full">Brainstorm ideas</button>
      <button class="bg-white/80 border text-gray-700 px-3 py-1.5 rounded-full">Write dialogue</button>
      <button class="bg-white/80 border text-gray-700 px-3 py-1.5 rounded-full">Analyse Highlighted Paper</button>
    </div>

    <!-- Chat Box -->
    <div class="bg-white rounded-3xl p-2 px-4 shadow-sm border flex items-center justify-between">
      <button onclick="toggleModal()" class="text-gray-500 text-xl p-2 hover:bg-gray-100 rounded-full">
        <i class="fa-solid fa-plus"></i>
      </button>
      <input type="text" id="userInputPrompt" placeholder="Message Analyser..." class="w-full mx-2 border-none outline-none text-gray-700">
      <button onclick="processRequest()" class="text-gray-600 text-xl p-2 hover:text-black">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </div>

  <!-- Bottom Sheet / Photo Injection Modal -->
  <div id="photoModal" class="bottom-sheet fixed inset-x-0 bottom-0 bg-white rounded-t-3xl shadow-2xl p-6 transform translate-y-full max-w-lg mx-auto z-50">
    <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6 cursor-pointer" onclick="toggleModal()"></div>
    
    <!-- Injection Media Icons -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <label class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded-2xl cursor-pointer hover:bg-gray-200">
        <i class="fa-solid fa-camera text-2xl text-gray-700 mb-2"></i>
        <span class="text-xs font-medium text-gray-700">Camera</span>
        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageInjection(event)">
      </label>

      <label class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded-2xl cursor-pointer hover:bg-gray-200">
        <i class="fa-solid fa-image text-2xl text-gray-700 mb-2"></i>
        <span class="text-xs font-medium text-gray-700">Photos</span>
        <input type="file" accept="image/*" class="hidden" onchange="handleImageInjection(event)">
      </label>

      <label class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded-2xl cursor-pointer hover:bg-gray-200">
        <i class="fa-solid fa-file text-2xl text-gray-700 mb-2"></i>
        <span class="text-xs font-medium text-gray-700">Files</span>
        <input type="file" class="hidden" onchange="handleImageInjection(event)">
      </label>
    </div>

    <!-- Features Options -->
    <div class="space-y-4 border-t pt-4">
      <div class="flex items-center gap-3 text-gray-700 text-sm font-medium cursor-pointer" onclick="triggerPredictor()">
        <i class="fa-solid fa-brain text-lg w-6 text-purple-600"></i> Predict Examiner Mindset & Questions
      </div>
      <div class="flex items-center gap-3 text-gray-700 text-sm font-medium cursor-pointer" onclick="triggerPredictor()">
        <i class="fa-solid fa-list-check text-lg w-6 text-blue-600"></i> Generate High Probability MCQs
      </div>
    </div>
  </div>

  <!-- JavaScript Orchestrator Logic -->
  <script>
    let injectedImageBuffer = null;

    function toggleModal() {
      const modal = document.getElementById('photoModal');
      modal.classList.toggle('translate-y-full');
    }

    // Photo Injection Logic with Ephemeral Buffer
    function handleImageInjection(event) {
      const file = event.target.files[0];
      if (file) {
        injectedImageBuffer = file;
        toggleModal();
        
        // Show status card
        document.getElementById('outputCard').classList.remove('hidden');
        document.getElementById('analysisResults').innerHTML = `
          <div class="flex items-center gap-2 text-blue-600 font-medium">
            <i class="fa-solid fa-spinner fa-spin"></i> Injecting photo into temporary RAM buffer...
          </div>
        `;

        // Automatically trigger AI Orchestrator Router
        setTimeout(() => {
          routeToBestAIModel(file);
        }, 1200);
      }
    }

    // Auto AI Router Engine Logic
    async function routeToBestAIModel(imageFile) {
      document.getElementById('analysisResults').innerHTML = `
        <div class="flex items-center gap-2 text-purple-600 font-medium">
          <i class="fa-solid fa-microchip fa-spin"></i> Auto-routing to optimal Vision Model (Examiner Mindset Engine)...
        </div>
      `;

      // Simulating Multi-AI Provider Auto Connection
      setTimeout(() => {
        // Display predicted examiner mindset results
        document.getElementById('analysisResults').innerHTML = `
          <div class="p-3 bg-purple-50 rounded-lg border border-purple-100 mb-2">
            <p class="font-semibold text-purple-900">Predicted Examiner Question 1 (92% Probability)</p>
            <p class="text-xs text-gray-600 mt-1">Based on highlights and board patterns in Physics.</p>
            <p class="text-xs font-semibold text-gray-800 mt-2">Micro-Concept:</p>
            <p class="text-xs text-gray-600">State and derive the second law of motion in simple terms.</p>
          </div>
          <div class="p-3 bg-green-50 rounded-lg border border-green-100">
            <p class="font-semibold text-green-900">Important MCQ Prediction (88% Probability)</p>
            <p class="text-xs text-gray-600 mt-1">S.I. unit of Force is Newton (N) = kg·m/s².</p>
          </div>
        `;

        // Clear Image from Buffer completely for privacy and speed
        injectedImageBuffer = null;
        console.log("Memory Buffer Cleared: Image permanently removed.");
      }, 2500);
    }

    function processRequest() {
      const prompt = document.getElementById('userInputPrompt').value;
      if (prompt.trim() !== "") {
        document.getElementById('outputCard').classList.remove('hidden');
        document.getElementById('analysisResults').innerText = "Processing request via Auto AI Router: " + prompt;
        document.getElementById('userInputPrompt').value = "";
      }
    }
  </script>
</body>
  </html>
